[project]
name = "vntrans"
version = "0.1.0"
description = "Lossless visual novel script extraction and translation reinsertion"
readme = "README.md"
authors = [
    { name = "KidiXDev" }
]
requires-python = ">=3.13"
dependencies = [
    "orjson>=3.13,<4",
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.scripts]
vntrans = "vntrans:main"
vntrans-gui = "vntrans.gui:main"

[project.optional-dependencies]
gui = [
    "jeepney>=0.9 ; sys_platform == 'linux'",
    "slint>=1.18.1b1,<1.19",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "UP",     # Python modernization
    "B",      # common bugs
    "SIM",    # simplification
    "RUF100", # unused noqa comments
]
# Let the formatter handle line wrapping, including strings it cannot split.
ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
